<div class="relative">
  @if (selectedPaciente) {
    <div class="flex items-center gap-2 p-3 bg-muted/50 rounded-md border">
      <div class="flex-1">
        <p class="text-sm font-medium text-foreground">{{ getDisplayName() }}</p>
        <p class="text-xs text-muted-foreground">Historia: {{ selectedPaciente.codigoHistoria }}</p>
      </div>
      <button
        type="button"
        (click)="clearSelection()"
        class="inline-flex items-center justify-center h-6 w-6 rounded-md hover:bg-accent transition-colors text-muted-foreground"
      >
        ✕
      </button>
    </div>
  } @else {
    <div class="relative">
      <input
        type="text"
        [value]="searchTerm"
        (input)="onSearch($any($event.target).value)"
        (focus)="onFocus()"
        (blur)="onBlur()"
        placeholder="Buscar paciente por nombre o documento..."
        class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
      >

      @if (showDropdown) {
        <div class="absolute z-50 top-full left-0 right-0 mt-1 bg-card border rounded-md shadow-lg max-h-60 overflow-y-auto">
          @if (loading) {
            <div class="p-3 text-center text-sm text-muted-foreground">
              Buscando...
            </div>
          } @else if (resultados.length === 0) {
            <div class="p-3 text-center text-sm text-muted-foreground">
              No se encontraron pacientes
            </div>
          } @else {
            @for (paciente of resultados; track paciente.id) {
              <button
                type="button"
                (click)="selectPaciente(paciente)"
                class="w-full px-3 py-2 text-left hover:bg-accent transition-colors border-b last:border-b-0"
              >
                <p class="text-sm font-medium text-foreground">
                  {{ getNombreCompleto(paciente) }}
                </p>
                <p class="text-xs text-muted-foreground">
                  {{ paciente.numeroDocumento }} · Historia: {{ paciente.codigoHistoria }}
                </p>
              </button>
            }
          }
        </div>
      }
    </div>
  }
</div>
